  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;div class=&quot;osl-section-head&quot;&gt;&lt;h3&gt;Arrangements&lt;/h3&gt;&lt;small id=&quot;osl-language-summary&quot;&gt;Cebuano · English&lt;/small&gt;&lt;/div&gt;
      &lt;div id=&quot;osl-arrangements&quot; class=&quot;osl-arrangements&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;osl-context&quot;&gt;
        &lt;strong id=&quot;osl-context-title&quot;&gt;Shared parish repertoire&lt;/strong&gt;
        &lt;small id=&quot;osl-context-copy&quot;&gt;Choirs A and B share one Arrangement because their lyrics, Sequence, and generated slides are identical.&lt;/small&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/main&gt;

  &lt;main class=&quot;osl-editor&quot; aria-label=&quot;Arrangement editor preview&quot;&gt;
    &lt;header class=&quot;osl-editor-bar&quot;&gt;
      &lt;button type=&quot;button&quot; id=&quot;osl-back&quot; class=&quot;osl-button&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Back to Songs&lt;/button&gt;
      &lt;div class=&quot;osl-editor-title&quot;&gt;&lt;strong id=&quot;osl-editor-name&quot;&gt;Choir A · Cebuano&lt;/strong&gt;&lt;small id=&quot;osl-editor-crumb&quot;&gt;Songs / Kyrie · 3rd Mass / Choir A · Cebuano&lt;/small&gt;&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;osl-button&quot;&gt;Arrangement details&lt;/button&gt;
    &lt;/header&gt;
    &lt;div class=&quot;osl-editor-preview&quot;&gt;
      &lt;aside&gt;&lt;small&gt;Available sections&lt;/small&gt;&lt;h3&gt;Sections&lt;/h3&gt;&lt;div class=&quot;osl-placeholder-list&quot;&gt;&lt;div class=&quot;osl-placeholder-row&quot;&gt;Verse 1 · 2 slides&lt;/div&gt;&lt;div class=&quot;osl-placeholder-row&quot;&gt;Chorus · Used 2×&lt;/div&gt;&lt;div class=&quot;osl-placeholder-row&quot;&gt;Verse 2 · 2 slides&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;
      &lt;section&gt;&lt;small&gt;Performance sequence&lt;/small&gt;&lt;h3&gt;01 Verse 1 → 02 Chorus → 03 Verse 2&lt;/h3&gt;&lt;div class=&quot;osl-placeholder-list&quot;&gt;&lt;div class=&quot;osl-placeholder-row&quot;&gt;Selected occurrence · Verse 1&lt;/div&gt;&lt;div class=&quot;osl-placeholder-row&quot;&gt;Lyrics and Sequence workspace continues here&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
      &lt;aside&gt;&lt;small&gt;Inspector&lt;/small&gt;&lt;h3&gt;Canonical preview&lt;/h3&gt;&lt;div class=&quot;osl-frame&quot;&gt;Ginoo, kaloy-i kami&lt;br&gt;Kristo, kaloy-i kami&lt;/div&gt;&lt;/aside&gt;
    &lt;/div&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ordo-song-library-master-detail&#x27;);
      const songs = [
        {
          id: &#x27;kyrie-3&#x27;, title: &#x27;Kyrie · 3rd Mass&#x27;, attribution: &#x27;Traditional setting attributed to Msgr. Rudy Villanueva&#x27;, alias: &#x27;Ginoo, Kaloy-i Kami&#x27;, moment: &#x27;Penitential Act&#x27;, choirs: [&#x27;choir-a&#x27;, &#x27;choir-b&#x27;], languages: [&#x27;cebuano&#x27;, &#x27;english&#x27;],
          contextTitle: &#x27;Shared parish repertoire&#x27;, contextCopy: &#x27;Choirs A and B share one Arrangement because their lyrics, Sequence, and generated slides are identical.&#x27;,
          arrangements: [
            { name: &#x27;Choirs A, B · Cebuano&#x27;, note: &#x27;Original wording · updated 2 days ago&#x27;, meta: &#x27;4 sections · 7 slides&#x27;, language: &#x27;Cebuano&#x27; },
            { name: &#x27;Choir B · English adaptation&#x27;, note: &#x27;Adapted by Walter M. · updated 3 months ago&#x27;, meta: &#x27;4 sections · 8 slides&#x27;, language: &#x27;English&#x27; }
          ]
        },
        {
          id: &#x27;kyrie-8&#x27;, title: &#x27;Kyrie · 8th Mass&#x27;, attribution: &#x27;Gregorian setting · parish edition&#x27;, alias: &#x27;Missa de Angelis&#x27;, moment: &#x27;Penitential Act&#x27;, choirs: [&#x27;choir-a&#x27;], languages: [&#x27;cebuano&#x27;],
          contextTitle: &#x27;Seasonal use&#x27;, contextCopy: &#x27;Choir A commonly uses this Arrangement during Ordinary Time and parish feast celebrations.&#x27;,
          arrangements: [{ name: &#x27;Choir A · Cebuano&#x27;, note: &#x27;Reviewed last month&#x27;, meta: &#x27;3 sections · 5 slides&#x27;, language: &#x27;Cebuano&#x27; }]
        },
        {
          id: &#x27;kyrie-13&#x27;, title: &#x27;Kyrie · 13th Mass&#x27;, attribution: &#x27;Traditional parish setting&#x27;, alias: &#x27;Kyrie XIII&#x27;, moment: &#x27;Penitential Act&#x27;, choirs: [&#x27;choir-c&#x27;], languages: [&#x27;cebuano&#x27;],
          contextTitle: &#x27;Choir-specific rendition&#x27;, contextCopy: &#x27;This exact wording and Sequence are currently associated with Choir C.&#x27;,
          arrangements: [{ name: &#x27;Choir C · Cebuano&#x27;, note: &#x27;Slides need review&#x27;, meta: &#x27;4 sections · 6 slides&#x27;, language: &#x27;Cebuano&#x27; }]
        },
        {
          id: &#x27;kyrie-eleison&#x27;, title: &#x27;Kyrie Eleison&#x27;, attribution: &#x27;Traditional chant&#x27;, alias: &#x27;Lord, have mercy&#x27;, moment: &#x27;Penitential Act&#x27;, choirs: [&#x27;choir-b&#x27;], languages: [&#x27;english&#x27;],
          contextTitle: &#x27;Traditional chant&#x27;, contextCopy: &#x27;One simple English-language Arrangement is currently available.&#x27;,
          arrangements: [{ name: &#x27;Choir B · English&#x27;, note: &#x27;Approved&#x27;, meta: &#x27;2 sections · 2 slides&#x27;, language: &#x27;English&#x27; }]
        },
        {
          id: &#x27;gloria-8&#x27;, title: &#x27;Gloria · 8th Mass&#x27;, attribution: &#x27;Gregorian setting&#x27;, alias: &#x27;Glory to God&#x27;, moment: &#x27;Gloria&#x27;, choirs: [&#x27;choir-a&#x27;], languages: [&#x27;cebuano&#x27;],
          contextTitle: &#x27;Not shown in current query&#x27;, contextCopy: &#x27;Search for Gloria to reveal this Song work.&#x27;,
          arrangements: [{ name: &#x27;Choir A · Cebuano&#x27;, note: &#x27;Approved&#x27;, meta: &#x27;5 sections · 9 slides&#x27;, language: &#x27;Cebuano&#x27; }]
        }
      ];
      const search = root.querySelector(&#x27;#osl-search&#x27;);
      const choir = root.querySelector(&#x27;#osl-choir&#x27;);
      const language = root.querySelector(&#x27;#osl-language&#x27;);
      const results = root.querySelector(&#x27;#osl-results&#x27;);
      let selectedId = &#x27;kyrie-3&#x27;;

      function safe(value) {
        return String(value).replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;);
      }

      function filteredSongs() {
        const query = search.value.trim().toLocaleLowerCase();
        return songs.filter(song =&gt; {
          const matchesQuery = !query || [song.title, song.attribution, song.alias].join(&#x27; &#x27;).toLocaleLowerCase().includes(query);
          const matchesChoir = choir.value === &#x27;all&#x27; || song.choirs.includes(choir.value);
          const matchesLanguage = language.value === &#x27;all&#x27; || song.languages.includes(language.value);
          return matchesQuery &amp;&amp; matchesChoir &amp;&amp; matchesLanguage;
        });
      }

      function renderDetail(song) {
        root.querySelector(&#x27;#osl-title&#x27;).textContent = song.title;
        root.querySelector(&#x27;#osl-attribution&#x27;).textContent = song.attribution;
        root.querySelector(&#x27;#osl-alias&#x27;).textContent = song.alias;
        root.querySelector(&#x27;#osl-moment&#x27;).textContent = song.moment;
        root.querySelector(&#x27;#osl-total&#x27;).textContent = `${song.arrangements.length} reusable rendition${song.arrangements.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
        root.querySelector(&#x27;#osl-language-summary&#x27;).textContent = [...new Set(song.arrangements.map(item =&gt; item.language))].join(&#x27; · &#x27;);
        root.querySelector(&#x27;#osl-context-title&#x27;).textContent = song.contextTitle;
        root.querySelector(&#x27;#osl-context-copy&#x27;).textContent = song.contextCopy;
        root.querySelector(&#x27;#osl-arrangements&#x27;).innerHTML = song.arrangements.map((item, index) =&gt; `
          &lt;button type=&quot;button&quot; class=&quot;osl-arrangement&quot; data-arrangement=&quot;${index}&quot;&gt;
            &lt;span&gt;&lt;strong&gt;${safe(item.name)}&lt;/strong&gt;&lt;small&gt;${safe(item.note)}&lt;/small&gt;&lt;/span&gt;
            &lt;span&gt;&lt;strong&gt;${safe(item.meta)}&lt;/strong&gt;&lt;small&gt;${safe(item.language)}&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;osl-open&quot;&gt;Open &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
          &lt;/button&gt;
        `).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-arrangement]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openArrangement(song, song.arrangements[Number(button.dataset.arrangement)])));
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function render() {
        const visible = filteredSongs();
        root.querySelector(&#x27;#osl-result-count&#x27;).textContent = `${visible.length} song${visible.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
        if (!visible.some(song =&gt; song.id === selectedId)) selectedId = visible[0]?.id ?? null;
        results.innerHTML = visible.length ? visible.map(song =&gt; `
          &lt;button type=&quot;button&quot; class=&quot;osl-song&quot; data-song=&quot;${song.id}&quot; aria-pressed=&quot;${song.id === selectedId}&quot;&gt;
            &lt;span&gt;&lt;strong&gt;${safe(song.title)}&lt;/strong&gt;&lt;small&gt;${safe(song.attribution)}&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;osl-count&quot;&gt;${song.arrangements.length}&lt;/span&gt;
          &lt;/button&gt;
        `).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;osl-empty&quot;&gt;No songs match these filters.&lt;/div&gt;&#x27;;
        root.querySelectorAll(&#x27;[data-song]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          selectedId = button.dataset.song;
          render();
        }));
        const selected = songs.find(song =&gt; song.id === selectedId);
        if (selected) renderDetail(selected);
      }

      function openArrangement(song, arrangement) {
        root.dataset.view = &#x27;editor&#x27;;
        root.querySelector(&#x27;#osl-editor-name&#x27;).textContent = arrangement.name;
        root.querySelector(&#x27;#osl-editor-crumb&#x27;).textContent = `Songs / ${song.title} / ${arrangement.name}`;
      }

      search.addEventListener(&#x27;input&#x27;, render);
      choir.addEventListener(&#x27;change&#x27;, render);
      language.addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;#osl-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.dataset.view = &#x27;library&#x27;;
        render();
      });
      root.dataset.view = &#x27;library&#x27;;
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
