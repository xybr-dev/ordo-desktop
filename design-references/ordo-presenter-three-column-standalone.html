  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #ordo-presenter-concept {
      --ordo-bg: light-dark(#edf0f4, #0f141b);
      --ordo-window: light-dark(#ffffff, #171d26);
      --ordo-panel: light-dark(#f7f8fa, #202833);

      --ordo-border: light-dark(#d7dde7, #394454);

      --ordo-accent-text: light-dark(#ffffff, #161020);
      --ordo-success: light-dark(#17724d, #52d49a);
      --ordo-success-text: light-dark(#ffffff, #092319);
      --ordo-priest: light-dark(#a25b13, #efb76e);
      --ordo-all: light-dark(#315da8, #82b1ff);
      --ordo-projector: #050608;

      color: var(--ordo-text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      width: 100%;
    }

    #ordo-presenter-concept * { box-sizing: border-box; }

    #ordo-presenter-concept .ordo-shell {
      background: var(--ordo-window);
      border: 1px solid var(--ordo-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 36px light-dark(rgb(25 34 50 / 14%), rgb(0 0 0 / 30%));
    }

    #ordo-presenter-concept .ordo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--ordo-border);
    }

    #ordo-presenter-concept .ordo-brand,
    #ordo-presenter-concept .ordo-status,
    #ordo-presenter-concept .ordo-actions,
    #ordo-presenter-concept .ordo-cue-meta {
      display: flex;
      align-items: center;
      gap: 8px;

    #ordo-presenter-concept .ordo-grid {
      display: grid;
      grid-template-columns: minmax(180px, .7fr) minmax(300px, 1.25fr) minmax(270px, 1fr);
      min-height: 540px;
      background: var(--ordo-bg);
    }

    #ordo-presenter-concept .ordo-column {
      min-width: 0;
      padding: 14px;
      border-right: 1px solid var(--ordo-border);
    }

    #ordo-presenter-concept .ordo-column:last-child { border-right: 0; }

    #ordo-presenter-concept .ordo-column-head { margin-bottom: 12px; }
    #ordo-presenter-concept .ordo-column-head p { color: var(--ordo-muted); }

    #ordo-presenter-concept button {
      appearance: none;
      border: 1px solid var(--ordo-border);
      border-radius: 7px;
      background: var(--ordo-panel);
      color: var(--ordo-text);
      padding: 7px 9px;
      font: inherit;
      cursor: pointer;

    #ordo-presenter-concept button:hover { background: var(--ordo-panel-strong); }
    #ordo-presenter-concept button:focus-visible { outline: 2px solid var(--ordo-accent); outline-offset: 2px; }

    #ordo-presenter-concept .ordo-order {

    #ordo-presenter-concept .ordo-order button {
      display: grid;

      width: 100%;
      text-align: left;
      background: transparent;
      border-color: transparent;

      gap: 9px;
      padding: 10px;

            &lt;div class=&quot;ordo-screen ordo-preview-screen&quot;&gt;&lt;strong id=&quot;ordo-preview-text&quot;&gt;MAANAA USAB KANIMO&lt;/strong&gt;&lt;/div&gt;
            &lt;div class=&quot;ordo-operator-cue ordo-preview-cue&quot;&gt;&lt;span class=&quot;ordo-role p&quot; id=&quot;ordo-selected-role&quot;&gt;P&lt;/span&gt;&lt;div&gt;&lt;strong id=&quot;ordo-selected-text&quot;&gt;Ang Ginoo maanaa kaninyo.&lt;/strong&gt;&lt;p class=&quot;ordo-muted&quot;&gt;Trigger cue; Program remains independent&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

          &lt;button type=&quot;button&quot; id=&quot;ordo-freeze&quot;&gt;Freeze Program&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;ordo-take&quot; id=&quot;ordo-take&quot;&gt;Take preview&lt;/button&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ordo-presenter-concept&#x27;);
      const cues = [...root.querySelectorAll(&#x27;.ordo-cue[data-role]&#x27;)];
      const selectedRole = root.querySelector(&#x27;#ordo-selected-role&#x27;);
      const selectedText = root.querySelector(&#x27;#ordo-selected-text&#x27;);
      const selectedVisibility = root.querySelector(&#x27;#ordo-selected-visibility&#x27;);
      const screenText = root.querySelector(&#x27;#ordo-screen-text&#x27;);
      const previewText = root.querySelector(&#x27;#ordo-preview-text&#x27;);
      const state = root.querySelector(&#x27;#ordo-state&#x27;);
      const dot = root.querySelector(&#x27;#ordo-state-dot&#x27;);
      const outputState = root.querySelector(&#x27;#ordo-output-state&#x27;);
      const freeze = root.querySelector(&#x27;#ordo-freeze&#x27;);
      let selected = cues[0];
      let frozen = false;

      function selectCue(cue) {
        cues.forEach(item =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === cue)));
        selected = cue;
        selectedRole.textContent = cue.dataset.role;
        selectedRole.className = `ordo-role ${cue.dataset.role.toLowerCase()}`;
        selectedText.textContent = cue.dataset.text;
        if (cue.dataset.visibility === &#x27;Congregation&#x27;) {
          previewText.textContent = cue.dataset.text;
          selectedVisibility.textContent = &#x27;Selected slide&#x27;;
        } else {
          const cueIndex = cues.indexOf(cue);
          const upcoming = cues.slice(cueIndex + 1).find(item =&gt; item.dataset.visibility === &#x27;Congregation&#x27;);
          previewText.textContent = upcoming ? upcoming.dataset.text : &#x27;&#x27;;
          selectedVisibility.textContent = &#x27;Next congregation output&#x27;;
        }
      }

      cues.forEach(cue =&gt; cue.addEventListener(&#x27;click&#x27;, () =&gt; selectCue(cue)));

      freeze.addEventListener(&#x27;click&#x27;, () =&gt; {
        const wasFrozen = frozen;
        frozen = !frozen;
        if (wasFrozen &amp;&amp; !frozen) screenText.textContent = previewText.textContent;
        state.textContent = frozen ? &#x27;FROZEN&#x27; : &#x27;LIVE&#x27;;
        dot.style.background = frozen ? &#x27;var(--ordo-accent)&#x27; : &#x27;var(--ordo-success)&#x27;;
        outputState.textContent = frozen ? &#x27;Held&#x27; : &#x27;Current&#x27;;
        freeze.textContent = frozen ? &#x27;Unfreeze &amp; take preview&#x27; : &#x27;Freeze Program&#x27;;
        freeze.classList.toggle(&#x27;ordo-freeze-on&#x27;, frozen);
      });

      root.querySelector(&#x27;#ordo-take&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        screenText.textContent = previewText.textContent;
        frozen = false;
        state.textContent = &#x27;LIVE&#x27;;
        dot.style.background = &#x27;var(--ordo-success)&#x27;;
        outputState.textContent = &#x27;Current&#x27;;
        freeze.textContent = &#x27;Freeze Program&#x27;;
        freeze.classList.remove(&#x27;ordo-freeze-on&#x27;);
      });

      root.querySelector(&#x27;#ordo-blackout&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        screenText.textContent = &#x27;&#x27;;
        outputState.textContent = &#x27;Blackout&#x27;;
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
