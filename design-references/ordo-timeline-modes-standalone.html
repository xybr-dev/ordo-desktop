  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;

#widget &gt; svg {
  width: 100%;

svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-destructive {

        &lt;div class=&quot;otm-group&quot;&gt;
          &lt;div class=&quot;otm-group-title&quot;&gt;&lt;strong&gt;Gloria · Choir A setting&lt;/strong&gt;&lt;span&gt;6 slides&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;otm-grid otm-slide-set&quot; data-view=&quot;grid&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;otm-list otm-slide-set otm-hidden&quot; data-view=&quot;list&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;otm-pane&quot;&gt;
      &lt;div class=&quot;otm-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;3 · Output&lt;/strong&gt;&lt;span&gt;Congregation and operator&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;otm-output-body&quot;&gt;
        &lt;div&gt;&lt;div class=&quot;otm-monitor-label&quot;&gt;PROGRAM &lt;span&gt;Congregation · live&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;otm-monitor&quot; id=&quot;otm-program&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;otm-monitor-label&quot;&gt;PREVIEW &lt;span&gt;Selected cue&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;otm-monitor&quot; id=&quot;otm-preview&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;otm-operator-cue&quot;&gt;&lt;span class=&quot;otm-role&quot;&gt;P&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Ang Ginoo maanaa kaninyo.&lt;/strong&gt;&lt;span&gt;Right → project the selected T response&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;otm-actions&quot;&gt;&lt;button class=&quot;otm-action&quot; type=&quot;button&quot;&gt;Freeze · F&lt;/button&gt;&lt;button class=&quot;otm-action&quot; type=&quot;button&quot;&gt;Blackout · B&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ordo-timeline-modes&#x27;);
      const slides = [
        { group: 0, role: &#x27;T&#x27;, section: &#x27;Response&#x27;, text: &#x27;MAANAA USAB\nKANIMO&#x27; },
        { group: 1, role: &#x27;T&#x27;, section: &#x27;Response 1&#x27;, text: &#x27;GINOO,\nKALOY-I KAMI&#x27; },
        { group: 1, role: &#x27;T&#x27;, section: &#x27;Response 2&#x27;, text: &#x27;CRISTO,\nKALOY-I KAMI&#x27; },
        { group: 1, role: &#x27;T&#x27;, section: &#x27;Response 3&#x27;, text: &#x27;GINOO,\nKALOY-I KAMI&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Verse 1&#x27;, text: &#x27;HIMAYA SA DIOS\nDIDTO SA LANGIT&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Chorus&#x27;, text: &#x27;UG KALINAW SA MGA TAWO\nNGA IYANG GIHIGUGMA&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Long lyric&#x27;, text: &#x27;Ginoong Hesukristo, Bugtong Anak,\nGinoong Dios, Kordero sa Dios,\nAnak sa Amahan&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Chorus&#x27;, text: &#x27;GIDAYEG KA NAMO,\nGIPASALAMATAN KA NAMO&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Verse 3&#x27;, text: &#x27;GINOONG HESUKRISTO,\nBUGTONG ANAK&#x27; },
        { group: 2, role: &#x27;♪&#x27;, section: &#x27;Accents&#x27;, text: &#x27;Señor, kaloy-i kami\nSanctus · Glória · Amén&#x27; }
      ];
      let selected = 0;

      const slideFrame = text =&gt; `&lt;div class=&quot;otm-slide-frame&quot;&gt;&lt;span&gt;${text}&lt;/span&gt;&lt;/div&gt;`;
      const grouped = [0, 1, 2].map(group =&gt; slides.map((slide, index) =&gt; ({ ...slide, index })).filter(slide =&gt; slide.group === group));

      function select(index) {
        selected = index;
        root.querySelectorAll(&#x27;[data-slide-index]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-selected&#x27;, String(Number(button.dataset.slideIndex) === selected)));
        const markup = slideFrame(slides[selected].text);
        root.querySelector(&#x27;#otm-program&#x27;).innerHTML = markup;
        root.querySelector(&#x27;#otm-preview&#x27;).innerHTML = markup;
      }

      root.querySelectorAll(&#x27;.otm-slide-set&#x27;).forEach((set, setIndex) =&gt; {
        const group = Math.floor(setIndex / 2);
        const view = set.dataset.view;
        if (view === &#x27;grid&#x27;) {
          set.innerHTML = grouped[group].map(slide =&gt; `&lt;button class=&quot;otm-slide-button&quot; type=&quot;button&quot; data-slide-index=&quot;${slide.index}&quot; aria-selected=&quot;${slide.index === selected}&quot;&gt;&lt;span class=&quot;otm-slide-number&quot;&gt;${slide.index + 1}&lt;/span&gt;${slideFrame(slide.text)}&lt;/button&gt;`).join(&#x27;&#x27;);
        } else {
          set.innerHTML = grouped[group].map(slide =&gt; `&lt;button class=&quot;otm-list-row&quot; type=&quot;button&quot; data-slide-index=&quot;${slide.index}&quot; aria-selected=&quot;${slide.index === selected}&quot;&gt;&lt;span class=&quot;otm-list-index&quot;&gt;${slide.index + 1}&lt;/span&gt;&lt;span class=&quot;otm-role&quot;&gt;${slide.role}&lt;/span&gt;&lt;span class=&quot;otm-list-copy&quot;&gt;&lt;strong&gt;${slide.section}&lt;/strong&gt;&lt;span&gt;${slide.text.replace(&#x27;\n&#x27;, &#x27; · &#x27;)}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
        }
      });

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const slide = event.target.closest(&#x27;[data-slide-index]&#x27;);
        if (slide) select(Number(slide.dataset.slideIndex));
      });

      function setMode(mode) {
        root.querySelector(&#x27;#otm-list-mode&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(mode === &#x27;list&#x27;));
        root.querySelector(&#x27;#otm-grid-mode&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(mode === &#x27;grid&#x27;));
        root.querySelectorAll(&#x27;.otm-slide-set&#x27;).forEach(set =&gt; set.classList.toggle(&#x27;otm-hidden&#x27;, set.dataset.view !== mode));
        root.querySelector(&#x27;#otm-density-label&#x27;).textContent = mode === &#x27;grid&#x27; ? &#x27;Exact slide grid · responsive density&#x27; : &#x27;Numbered cue rows · dense navigation&#x27;;
      }

      root.querySelector(&#x27;#otm-list-mode&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setMode(&#x27;list&#x27;));
      root.querySelector(&#x27;#otm-grid-mode&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setMode(&#x27;grid&#x27;));
      root.querySelector(&#x27;#otm-rail-toggle&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.classList.toggle(&#x27;otm-rail-collapsed&#x27;));
      const fontSettings = {
        atkinson: [&#x27;&quot;Atkinson Hyperlegible Next&quot;, sans-serif&#x27;, &#x27;800&#x27;],
        noto: [&#x27;&quot;Noto Sans&quot;, sans-serif&#x27;, &#x27;900&#x27;],
        arial: [&#x27;&quot;Arial Black&quot;, Arial, sans-serif&#x27;, &#x27;900&#x27;]
      };
      root.querySelectorAll(&#x27;[data-font]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const [family, weight] = fontSettings[button.dataset.font];
        root.style.setProperty(&#x27;--otm-projection-font&#x27;, family);
        root.style.setProperty(&#x27;--otm-projection-weight&#x27;, weight);
        root.querySelectorAll(&#x27;[data-font]&#x27;).forEach(option =&gt; option.setAttribute(&#x27;aria-pressed&#x27;, String(option === button)));
      }));
      select(0);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();

  document

})();
&lt;/script&gt;
