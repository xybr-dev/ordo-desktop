}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

          &lt;div class=&quot;button-row&quot;&gt;&lt;button class=&quot;secondary-button&quot; type=&quot;button&quot; data-cancel-warning&gt;Keep current&lt;/button&gt;&lt;button class=&quot;primary-button&quot; type=&quot;button&quot; data-confirm-restore&gt;Restore entire Arrangement&lt;/button&gt;&lt;/div&gt;

    &lt;div class=&quot;restore-result&quot; role=&quot;status&quot;&gt;&lt;span&gt;Revision restored as the latest version.&lt;/span&gt;&lt;button type=&quot;button&quot; data-undo&gt;Undo&lt;/button&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ordo-history-revision-demo&#x27;);
      const historyPanel = root.querySelector(&#x27;.history-parent&#x27;);
      const comparePanel = root.querySelector(&#x27;.compare-child&#x27;);
      const compareFooter = root.querySelector(&#x27;.compare-footer&#x27;);
      const footerMain = root.querySelector(&#x27;.footer-main&#x27;);
      const footerConfirm = root.querySelector(&#x27;.footer-confirm&#x27;);
      const result = root.querySelector(&#x27;.restore-result&#x27;);
      const modeButtons = [...root.querySelectorAll(&#x27;[data-mode]&#x27;)];
      const tabButtons = [...root.querySelectorAll(&#x27;[data-tab]&#x27;)];
      let mode = &#x27;arrangement&#x27;;
      let tab = &#x27;lyrics&#x27;;

      const resetRestoreResult = () =&gt; {
        result.classList.remove(&#x27;visible&#x27;);
        result.querySelector(&#x27;span&#x27;).textContent = &#x27;Revision restored as the latest version.&#x27;;
        result.querySelector(&#x27;button&#x27;).style.display = &#x27;&#x27;;
      };

      const content = {
        arrangement: {
          overview: {
            current: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Display title&lt;/div&gt;&lt;div&gt;Cebuano · Choir A + B&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Choirs&lt;/div&gt;&lt;div&gt;Choir A, Choir B&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Occasions&lt;/div&gt;&lt;div class=&quot;line changed-old&quot;&gt;Ordinary Time, Easter&lt;/div&gt;&lt;/div&gt;&#x27;,
            old: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Display title&lt;/div&gt;&lt;div&gt;Cebuano · Choir A + B&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Choirs&lt;/div&gt;&lt;div&gt;Choir A, Choir B&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Occasions&lt;/div&gt;&lt;div class=&quot;line changed-new&quot;&gt;Ordinary Time&lt;/div&gt;&lt;/div&gt;&#x27;
          },
          lyrics: {
            current: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Kyrie · Slide 1&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Ginoo, kaloy-i kami.&lt;/div&gt;&lt;div class=&quot;line changed-old&quot;&gt;Ginoo, malooy ka kanamo.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Slide 2&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Kristo, kaloy-i kami.&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Kristo, kaloy-i kami.&lt;/div&gt;&lt;/div&gt;&#x27;,
            old: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Kyrie · Slide 1&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Ginoo, kaloy-i kami.&lt;/div&gt;&lt;div class=&quot;line changed-new&quot;&gt;Ginoo, kaloy-i kami.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Slide 2&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Kristo, kaloy-i kami.&lt;/div&gt;&lt;div class=&quot;line&quot;&gt;Kristo, kaloy-i kami.&lt;/div&gt;&lt;/div&gt;&#x27;
          },
          sequence: {
            current: &#x27;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;Kyrie · 2 slides&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;Christe · 1 slide&lt;/span&gt;&lt;span class=&quot;changed-chip&quot;&gt;Moved&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;3&lt;/span&gt;&lt;span&gt;Kyrie · 2 slides&lt;/span&gt;&lt;/div&gt;&#x27;,
            old: &#x27;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;Kyrie · 2 slides&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;Kyrie · 2 slides&lt;/span&gt;&lt;span class=&quot;changed-chip&quot;&gt;Earlier order&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sequence-row&quot;&gt;&lt;span class=&quot;sequence-number&quot;&gt;3&lt;/span&gt;&lt;span&gt;Christe · 1 slide&lt;/span&gt;&lt;/div&gt;&#x27;
          },
          slides: {
            current: &#x27;&lt;div class=&quot;slide-strip&quot;&gt;&lt;div class=&quot;slide-thumb&quot;&gt;Ginoo, kaloy-i kami&lt;br&gt;Ginoo, malooy ka kanamo&lt;/div&gt;&lt;div class=&quot;slide-thumb&quot;&gt;Kristo, kaloy-i kami&lt;/div&gt;&lt;/div&gt;&#x27;,
            old: &#x27;&lt;div class=&quot;slide-strip&quot;&gt;&lt;div class=&quot;slide-thumb&quot;&gt;Ginoo, kaloy-i kami&lt;br&gt;Ginoo, kaloy-i kami&lt;/div&gt;&lt;div class=&quot;slide-thumb&quot;&gt;Kristo, kaloy-i kami&lt;/div&gt;&lt;/div&gt;&#x27;
          }
        },
        song: {
          overview: {
            current: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Primary title&lt;/div&gt;&lt;div&gt;Kyrie — 8th Mass&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Aliases&lt;/div&gt;&lt;div class=&quot;line changed-old&quot;&gt;Missa VIII Kyrie, De Angelis&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Composer / source&lt;/div&gt;&lt;div&gt;Traditional Gregorian setting&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Liturgical moments&lt;/div&gt;&lt;div&gt;Kyrie&lt;/div&gt;&lt;/div&gt;&#x27;,
            old: &#x27;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Primary title&lt;/div&gt;&lt;div&gt;Kyrie — 8th Mass&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Aliases&lt;/div&gt;&lt;div class=&quot;line changed-new&quot;&gt;Missa VIII Kyrie&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Composer / source&lt;/div&gt;&lt;div&gt;Traditional Gregorian setting&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;field-label&quot;&gt;Liturgical moments&lt;/div&gt;&lt;div&gt;Kyrie&lt;/div&gt;&lt;/div&gt;&#x27;
          }
        }
      };

      function render() {
        const effectiveTab = mode === &#x27;song&#x27; ? &#x27;overview&#x27; : tab;
        const pair = content[mode][effectiveTab];
        root.querySelector(&#x27;.version-current&#x27;).innerHTML = pair.current;
        root.querySelector(&#x27;.version-old&#x27;).innerHTML = pair.old;
        root.querySelector(&#x27;.entity-name&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Kyrie — 8th Mass&#x27; : &#x27;Cebuano · Choir A + B&#x27;;
        root.querySelector(&#x27;.session-title&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Edited Song details · 3 changes&#x27; : &#x27;Edited lyrics · 8 changes&#x27;;
        root.querySelector(&#x27;.revision-choice&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Updated aliases&#x27; : &#x27;Corrected refrain wording&#x27;;
        root.querySelector(&#x27;.standalone-title&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Song created from import&#x27; : &#x27;Updated from import&#x27;;
        root.querySelector(&#x27;.origin-label&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Manual edit · Updated aliases&#x27; : &#x27;Manual edit · Corrected refrain wording&#x27;;
        root.querySelector(&#x27;.warning-copy strong&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Restore this entire Song work?&#x27; : &#x27;Restore this entire Arrangement?&#x27;;
        root.querySelector(&#x27;.warning-copy span&#x27;).textContent = mode === &#x27;song&#x27;
          ? &#x27;This restores Song identity and metadata only. Its Arrangements and Presentation snapshots will not change.&#x27;
          : &#x27;Choir A + B and 4 editable Mass plans use it. Local overrides and Presentation snapshots will not change.&#x27;;
        root.querySelector(&#x27;[data-confirm-restore]&#x27;).textContent = mode === &#x27;song&#x27; ? &#x27;Restore entire Song&#x27; : &#x27;Restore entire Arrangement&#x27;;
        tabButtons.forEach(button =&gt; {
          const isOverview = button.dataset.tab === &#x27;overview&#x27;;
          button.hidden = mode === &#x27;song&#x27; &amp;&amp; !isOverview;
          button.setAttribute(&#x27;aria-selected&#x27;, String(button.dataset.tab === effectiveTab));
        });
      }

      modeButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        mode = button.dataset.mode;
        modeButtons.forEach(candidate =&gt; candidate.setAttribute(&#x27;aria-pressed&#x27;, String(candidate === button)));
        footerMain.classList.remove(&#x27;hidden&#x27;);
        footerConfirm.classList.remove(&#x27;visible&#x27;);
        compareFooter.classList.remove(&#x27;confirming&#x27;);
        resetRestoreResult();
        render();
      }));

      tabButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        tab = button.dataset.tab;
        render();
      }));

      root.querySelectorAll(&#x27;[data-back-history]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        historyPanel.classList.add(&#x27;foreground&#x27;);
        comparePanel.classList.add(&#x27;hidden&#x27;);
        footerMain.classList.remove(&#x27;hidden&#x27;);
        footerConfirm.classList.remove(&#x27;visible&#x27;);
        compareFooter.classList.remove(&#x27;confirming&#x27;);
      }));

      root.querySelectorAll(&#x27;[data-open-revision]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        resetRestoreResult();
        historyPanel.classList.remove(&#x27;foreground&#x27;);
        comparePanel.classList.remove(&#x27;hidden&#x27;);
      }));

      root.querySelector(&#x27;[data-restore]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        footerMain.classList.add(&#x27;hidden&#x27;);
        footerConfirm.classList.add(&#x27;visible&#x27;);
        compareFooter.classList.add(&#x27;confirming&#x27;);
      });
      root.querySelector(&#x27;[data-cancel-warning]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        footerMain.classList.remove(&#x27;hidden&#x27;);
        footerConfirm.classList.remove(&#x27;visible&#x27;);
        compareFooter.classList.remove(&#x27;confirming&#x27;);
      });
      root.querySelector(&#x27;[data-confirm-restore]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        footerMain.classList.remove(&#x27;hidden&#x27;);
        footerConfirm.classList.remove(&#x27;visible&#x27;);
        compareFooter.classList.remove(&#x27;confirming&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

    clearOpenTimeout();

              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
