name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ordo is Windows-only for the MVP (Decision 268).
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Verify
        run: cargo xtask verify

  windows-shaping-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate and compare shaping artifact
        shell: pwsh
        run: |
          $env:ORDO_UPDATE_FIXTURES = "1"
          cargo test -p rendering --locked --test shaping_probe || exit $LASTEXITCODE
          git diff --exit-code -- crates/rendering/tests/fixtures/shaping-probe.txt || exit $LASTEXITCODE
          (Get-FileHash crates/rendering/tests/fixtures/shaping-probe.txt -Algorithm SHA256).Hash.ToLower()

  windows-canonical-invariance:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compare packaged canonical composition
        shell: pwsh
        run: |
          cargo test -p native-runtime-tests --locked --test canonical_invariance || exit $LASTEXITCODE
          (Get-FileHash tests/native-runtime/golden/canonical-invariance.txt -Algorithm SHA256).Hash.ToLower()

  # T0.5 [NATIVE-AUTO] evidence gate. This job is separate and mandatory: it
  # enumerates the runner's real displays through the GPUI Adapter and drives
  # the congregation-output composition through synthetic topology refreshes,
  # so the native result is recorded as its own check. The `verify` job above
  # also runs this test inside the workspace suite (`cargo xtask verify`); the
  # duplication is deliberate, so a regression here fails under its own name.
  windows-display-control:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Enumerate native displays and refresh topology
        shell: pwsh
        run: |
          cargo test -p display-tests --locked --test native_display -- --nocapture || exit $LASTEXITCODE

  # T0.6 engine-only Presenter bench and memory baselines, in release on the
  # Windows runner; not the packaged E2E. Runs the engine bench, then the native window
  # measurement (`presenter-lab`: keydown-to-paint, display paths, memory baselines), and uploads
  # the measurement document. The same tests run inside the `verify` job's workspace suite; this
  # job is separate so a latency, memory, or oracle regression fails under its own name.
  windows-presenter-performance:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Measure Presenter performance
        shell: pwsh
        run: |
          cargo xtask measure-presenter || exit $LASTEXITCODE
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: presenter-performance-report
          path: target/ordo-performance/report.json
          if-no-files-found: error

  # T0.10 Phase 0 qualification bundle. Runs `cargo xtask qualify` on the Windows
  # runner, skipping the two steps already gated by their own jobs above
  # (`verify`) and below (`measure-presenter`). Fails on any failed or missing
  # step, or on incomplete provenance. The bundle is uploaded even on failure so
  # every result is retained.
  windows-qualification:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run qualification bundle
        shell: pwsh
        run: |
          cargo xtask qualify --skip "verify=covered by the verify job" --skip "measure-presenter=covered by windows-presenter-performance" || exit $LASTEXITCODE
      - name: Upload qualification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-bundle
          path: target/qualification/
          if-no-files-found: error
