name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Verify
        run: cargo xtask verify

  windows-shaping-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate and compare shaping artifact
        shell: pwsh
        run: |
          $env:ORDO_UPDATE_FIXTURES = "1"
          cargo test -p rendering --locked --test shaping_probe || exit $LASTEXITCODE
          git diff --exit-code -- crates/rendering/tests/fixtures/shaping-probe.txt || exit $LASTEXITCODE
          (Get-FileHash crates/rendering/tests/fixtures/shaping-probe.txt -Algorithm SHA256).Hash.ToLower()

  windows-canonical-invariance:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compare packaged canonical composition
        shell: pwsh
        run: |
          cargo test -p native-runtime-tests --locked --test canonical_invariance || exit $LASTEXITCODE
          (Get-FileHash tests/native-runtime/golden/canonical-invariance.txt -Algorithm SHA256).Hash.ToLower()
