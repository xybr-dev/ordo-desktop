[advisories]
yanked = "deny"
ignore = [
    # Transitive from gpui-base/syntect at the pinned T0.1 revision. This is an
    # unmaintained notice, not a reported vulnerability; revisit on upgrade.
    { id = "RUSTSEC-2025-0141", reason = "pinned gpui-base transitive dependency" },
    # Transitive directly from gpui-base at the pinned T0.1 revision.
    { id = "RUSTSEC-2024-0384", reason = "pinned gpui-base transitive dependency" },
    # Transitive from pinned GPUI graphics dependencies.
    { id = "RUSTSEC-2024-0436", reason = "pinned GPUI transitive dependency" },
    { id = "RUSTSEC-2026-0206", reason = "pinned GPUI SVG stack" },
    { id = "RUSTSEC-2026-0192", reason = "pinned GPUI font stack" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[bans]
# GPUI's cross-platform graph currently carries many target-specific duplicate
# versions. Advisories, licenses, and sources remain hard gates; dependency
# consolidation is handled during explicit framework-upgrade qualification.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = [
    "base-ui",
    "dioxus",
    "eframe",
    "egui",
    "gpui-component",
    "iced",
    "tauri",
    "web-view",
    "webkit2gtk",
    "wry",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/longbridge/gpui-component",
    "https://github.com/proptest-rs/proptest",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/zed",
]
