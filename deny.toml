[advisories]
yanked = "deny"
ignore = [
    # Re-checked at the T0.4a pins (gpui-base 0.7.1, gpui-pre 0.3.8); the
    # syntect notice (RUSTSEC-2025-0141) no longer applies and was removed.
    # Transitive directly from gpui-base (`instant`). An unmaintained notice,
    # not a reported vulnerability; revisit on upgrade.
    { id = "RUSTSEC-2024-0384", reason = "pinned gpui-base transitive dependency" },
    # Transitive from pinned GPUI graphics dependencies.
    { id = "RUSTSEC-2024-0436", reason = "pinned GPUI transitive dependency" },
    { id = "RUSTSEC-2026-0206", reason = "pinned GPUI SVG stack" },
    { id = "RUSTSEC-2026-0192", reason = "pinned GPUI font stack" },
    # zvariant 5 merged into zbus 6; no safe upgrade exists at the pin. Reached
    # only through gpui-pre-linux's AT-SPI accessibility stack, which a Windows
    # build never compiles (Decision 268). Unmaintained notices, not
    # vulnerabilities; revisit on the next gpui-pre upgrade.
    { id = "RUSTSEC-2026-0370", reason = "pinned gpui-pre-linux accessibility stack (zvariant)" },
    { id = "RUSTSEC-2026-0371", reason = "pinned gpui-pre-linux accessibility stack (zbus_names)" },
    { id = "RUSTSEC-2026-0372", reason = "pinned gpui-pre-linux accessibility stack (zvariant_derive)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[bans]
# GPUI's cross-platform graph currently carries many target-specific duplicate
# versions. Advisories, licenses, and sources remain hard gates; dependency
# consolidation is handled during explicit framework-upgrade qualification.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = [
    "base-ui",
    "dioxus",
    "eframe",
    "egui",
    # Zed's own GPUI family would be a second GPUI type universe beside the
    # pinned `gpui-pre` snapshot; gpui-fast and the GPUI Kit layers beyond
    # `gpui-base` stay out of the graph (T0.4a).
    "gpui",
    "gpui_platform",
    "gpui_macros",
    "gpui-component",
    "gpui-fast",
    "gpui-kit",
    "gpui-shell",
    "gpui-wry",
    "iced",
    "tauri",
    "web-view",
    "webkit2gtk",
    "wry",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git source is allowed. GPUI and gpui-base come from exact crates.io
# releases since T0.4a; a git source anywhere is a deliberate review event.
allow-git = []
