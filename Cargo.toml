[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/rendering",
    "crates/presentation",
    "crates/ui",
    "crates/platform",
    "crates/ordo",
    "tools/ui-lab",
    "tests/native-runtime",
    "tests/display",
    "xtask",
]
default-members = ["crates/ordo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
rendering = { path = "crates/rendering" }
presentation = { path = "crates/presentation" }
ui = { path = "crates/ui" }
platform = { path = "crates/platform" }
async-channel = "2.5.0"

# GPUI comes from Longbridge's exactly pinned `gpui-pre` crates.io snapshot of
# Zed, the same snapshot `gpui-base` is built against (T0.4a,
# docs/qualification/GPUI-BASE-T0.4a.md). Renaming each package back to its Zed
# name keeps every `gpui::` path unchanged. Every requirement is exact (`=`):
# a caret range would let Cargo pick a second, incompatible GPUI type universe.
# xtask enforces the exact requirements, the single crates.io-sourced crate
# family, and the recorded versions below against Cargo.lock; `zed` is
# informational.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-base = { version = "=0.7.1" }

[workspace.metadata.ordo.gpui-supply]
gpui-pre = "0.3.8"
zed = "279fe070bb389b79652e52065b2f001edcc0b11b"
gpui-base = "0.7.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "limited"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
