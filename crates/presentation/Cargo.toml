[package]
name = "presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
rendering.workspace = true
# Snapshot dependency digests. Exact pin: the fingerprint rule is a frozen
# contract, so the digest implementation must not drift under it.
sha2 = "=0.10.9"
# Manifest JSON (`snapshot-manifest` v2). Exact pins, the same versions as the
# contract spike, so the format and the parser move together.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
