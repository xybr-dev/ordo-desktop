[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Compiles the development-only scenario host; `ui-lab` is its only consumer.
lab = []

[dependencies]
gpui.workspace = true
gpui-base.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The rasterizer GPUI draws SVG icons with, at the version it pins, so a test
# can parse and render a bundled icon exactly as the operator will see it.
resvg = { version = "0.46.0", default-features = false }

[lints]
workspace = true
