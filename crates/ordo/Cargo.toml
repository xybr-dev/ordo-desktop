[package]
name = "ordo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
platform.workspace = true
presentation.workspace = true
rendering.workspace = true
ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# Row padding plus PNG encoding for finished viewport pixels, through the
# same qualified edge and pin the canonical raster path uses.
tiny-skia = "=0.11.4"
# Same pin as `rendering`: the retained-path check shapes the probe with the
# bundled faces exactly as the canonical shaper does.
rustybuzz = "=0.20.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
