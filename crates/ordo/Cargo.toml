[package]
name = "ordo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
domain.workspace = true
platform.workspace = true
presentation.workspace = true
rendering.workspace = true
ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
uuid.workspace = true
# Local close time of an interrupted session (T1.7d): the journal stores UTC,
# the operator reads local. `time` was already locked; `local-offset` adds
# `num_threads` and `libc` (Unix only), and the lockfile lists `time-macros`
# without building it.
time = { version = "=0.3.55", default-features = false, features = ["local-offset", "parsing"] }
# Row padding plus PNG encoding for finished viewport pixels, through the
# same qualified edge and pin the canonical raster path uses.
tiny-skia = "=0.11.4"
# Same pin as `rendering`: the retained-path check shapes the probe with the
# bundled faces exactly as the canonical shaper does.
rustybuzz = "=0.20.1"
# Process RSS, virtual memory, and CPU for the performance spike (T0.6 WP2).
# Pinned to the version already locked transitively; only the `system`
# feature (which carries process sampling) is enabled.
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }

# Thumbnail-sized decode (T1.4g): GPUI's `to_image_data` always decodes at
# full size and offers no downscale, so Visible-only frames decode and shrink
# through the same crate GPUI uses. Pinned to the version already locked;
# PNG is the only asset format a snapshot carries.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
# The live-control-lab example writes a synthetic 500-Cue snapshot.
presentation = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# Fault hooks (injected panic) for the supervision tests only. `storage` is a
# dev-dependency only: the Phase 1 Presenter runtime ships without SQLite
# (`cargo xtask architecture` enforces it until Phase 2 opens the Library).
storage = { workspace = true, features = ["fault-injection"] }

[lints]
workspace = true
